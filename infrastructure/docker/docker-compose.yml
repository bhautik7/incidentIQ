# ---------------------------------------------------------------------------
# IncidentIQ - local development stack
#
#   cp .env.example .env
#   docker compose -f infrastructure/docker/docker-compose.yml up -d --build
#
# Every container joins the single `incidentiq` bridge network and addresses
# the others by service name on the CONTAINER port. Host-published ports exist
# only for the developer's browser and tools.
# ---------------------------------------------------------------------------

name: ${COMPOSE_PROJECT_NAME:-incidentiq}

networks:
  incidentiq:
    driver: bridge

volumes:
  postgres-data:
  kafka-data:
  redis-data:
  minio-data:
  prometheus-data:
  grafana-data:

# Applied to every application container: same logging shape, same restart policy.
x-app-defaults: &app-defaults
  restart: unless-stopped
  networks: [incidentiq]
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:

  # =========================================================================
  # Data + messaging infrastructure
  # =========================================================================

  postgres:
    image: pgvector/pgvector:pg16
    container_name: incidentiq-postgres
    restart: unless-stopped
    networks: [incidentiq]
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Faster initdb; safe because this data directory is disposable.
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Runs only on first initialisation of an empty data directory.
      - ../postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  kafka:
    image: confluentinc/cp-kafka:7.8.0
    container_name: incidentiq-kafka
    restart: unless-stopped
    networks: [incidentiq]
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:29092
      # Two advertised listeners, because containers and the host reach the
      # broker by different names: `kafka:9092` from inside the network,
      # `localhost:29092` from the developer's machine.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:${KAFKA_HOST_PORT:-29092}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are created explicitly by kafka-init, so a typo in a topic name
      # fails loudly instead of silently creating a one-partition topic.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 168
    ports:
      - "${KAFKA_HOST_PORT:-29092}:29092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

  kafka-init:
    image: confluentinc/cp-kafka:7.8.0
    container_name: incidentiq-kafka-init
    networks: [incidentiq]
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    volumes:
      - ../kafka/create-topics.sh:/scripts/create-topics.sh:ro
    entrypoint: ["bash", "/scripts/create-topics.sh"]
    restart: "no"

  redis:
    image: redis:7.4-alpine
    container_name: incidentiq-redis
    restart: unless-stopped
    networks: [incidentiq]
    # Password comes from the environment; nothing is baked into the image.
    command: ["sh", "-c", "redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "${REDIS_HOST_PORT:-6380}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio:
    image: minio/minio:latest
    container_name: incidentiq-minio
    restart: unless-stopped
    networks: [incidentiq]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_API_HOST_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  minio-init:
    image: minio/mc:latest
    container_name: incidentiq-minio-init
    networks: [incidentiq]
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
    entrypoint:
      - sh
      - -c
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "local/$$MINIO_BUCKET"
        echo "bucket ready: $$MINIO_BUCKET"
    restart: "no"

  # =========================================================================
  # Monitoring
  # =========================================================================

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: incidentiq-prometheus
    restart: unless-stopped
    networks: [incidentiq]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    ports:
      - "${PROMETHEUS_HOST_PORT:-9090}:9090"
    volumes:
      - ../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  grafana:
    image: grafana/grafana:11.4.0
    container_name: incidentiq-grafana
    restart: unless-stopped
    networks: [incidentiq]
    depends_on:
      prometheus:
        condition: service_started
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports:
      - "${GRAFANA_HOST_PORT:-3001}:3000"
    volumes:
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # =========================================================================
  # Application services
  # =========================================================================

  api:
    <<: *app-defaults
    build:
      context: ../..
      dockerfile: services/api/Dockerfile
    image: incidentiq/api:dev
    container_name: incidentiq-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      IncidentIQ__LogFormat: ${LOG_FORMAT:-json}
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Cors__AllowedOrigins__0: ${WEB_ORIGIN:-http://localhost:3000}
      Cors__AllowedOrigins__1: ${VITE_DEV_ORIGIN:-http://localhost:5173}
      # Local-development convenience. In a deployed environment migrations run
      # as a separate gated step, because two replicas starting at once race.
      IncidentIQ__RunMigrationsOnStartup: ${DB_RUN_MIGRATIONS_ON_STARTUP:-false}
      IncidentIQ__SeedReferenceData: ${DB_SEED_REFERENCE_DATA:-false}
      IncidentIQ__SeedDevelopmentData: ${DB_SEED_DEVELOPMENT_DATA:-false}
    ports:
      - "${API_HOST_PORT:-5080}:8080"

  ingestion:
    <<: *app-defaults
    build:
      context: ../..
      dockerfile: services/ingestion/Dockerfile
    image: incidentiq/ingestion:dev
    container_name: incidentiq-ingestion
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      IncidentIQ__LogFormat: ${LOG_FORMAT:-json}
      # Deliberately no database connection string: ingestion must never be
      # able to block on PostgreSQL.
      Kafka__BootstrapServers: kafka:9092
      Cors__AllowedOrigins__0: ${WEB_ORIGIN:-http://localhost:3000}
      Cors__AllowedOrigins__1: ${VITE_DEV_ORIGIN:-http://localhost:5173}
      # Synthetic event publishers used to exercise the Kafka path. Not the
      # ingestion API, and never enabled outside local development.
      IncidentIQ__EnableDevelopmentEndpoints: ${ENABLE_DEV_ENDPOINTS:-false}
    ports:
      - "${INGESTION_HOST_PORT:-5081}:8080"

  event-processor:
    <<: *app-defaults
    build:
      context: ../..
      dockerfile: services/event-processor/Dockerfile
    image: incidentiq/event-processor:dev
    container_name: incidentiq-event-processor
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      IncidentIQ__LogFormat: ${LOG_FORMAT:-json}
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Kafka__BootstrapServers: kafka:9092
      Kafka__ConsumerGroupId: incident-processor
      Cors__AllowedOrigins__0: ${WEB_ORIGIN:-http://localhost:3000}
      Cors__AllowedOrigins__1: ${VITE_DEV_ORIGIN:-http://localhost:5173}
    ports:
      - "${EVENT_PROCESSOR_HOST_PORT:-5082}:8080"

  ai-analysis:
    <<: *app-defaults
    build:
      context: ../../workers/ai-analysis
      dockerfile: Dockerfile
    image: incidentiq/ai-analysis:dev
    container_name: incidentiq-ai-analysis
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      POSTGRES_DSN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      CORS_ALLOWED_ORIGINS: ${WEB_ORIGIN:-http://localhost:3000},${VITE_DEV_ORIGIN:-http://localhost:5173}
    ports:
      - "${AI_ANALYSIS_HOST_PORT:-5083}:8000"

  web:
    <<: *app-defaults
    build:
      context: ../../apps/web
      dockerfile: Dockerfile
    image: incidentiq/web:dev
    container_name: incidentiq-web
    depends_on:
      api:
        condition: service_started
    environment:
      # These are read by the BROWSER, which runs on the host - so they must be
      # host-published ports, never compose service names.
      WEB_API_BASE_URL: http://localhost:${API_HOST_PORT:-5080}
      WEB_INGESTION_BASE_URL: http://localhost:${INGESTION_HOST_PORT:-5081}
      WEB_EVENT_PROCESSOR_BASE_URL: http://localhost:${EVENT_PROCESSOR_HOST_PORT:-5082}
      WEB_AI_ANALYSIS_BASE_URL: http://localhost:${AI_ANALYSIS_HOST_PORT:-5083}
    ports:
      - "${WEB_HOST_PORT:-3000}:80"
