# WebSocket upgrades: "Connection: upgrade" only when the client asked for one,
# so ordinary requests through the same proxy are left alone.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Injected by the entrypoint from the container's environment, so the key lives
# in nginx's configuration rather than in anything sent to a browser.
map $host $incidentiq_api_key {
    default "__INCIDENTIQ_API_KEY__";
}

server {
    listen 80;
    # Also listen on IPv6: inside the container "localhost" resolves to [::1]
    # first, so an IPv4-only listener makes the HEALTHCHECK fail.
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Container/orchestrator liveness probe.
    location = /healthz {
        access_log off;
        # default_type replaces the content type; add_header would append a
        # second Content-Type header alongside nginx's own.
        default_type application/json;
        return 200 '{"status":"Healthy","service":"incidentiq-web"}';
    }

    # Runtime configuration is rewritten on every container start, so it must
    # never be cached by the browser.
    location = /config.js {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Vite emits content-hashed filenames, so these are safe to cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # ---- The API, reached through here rather than directly ----
    #
    # The browser used to call the API and ingestion on their own ports,
    # carrying the API key in a header it had been handed in config.js. That
    # key was therefore readable by anyone who loaded the page, and it is a
    # tenant's full read/write credential.
    #
    # nginx now holds it and adds it to each proxied request. The bundle no
    # longer contains a secret, there is nothing in devtools to copy, and the
    # API and ingestion no longer need to be published to the internet at all -
    # one origin serves the page and everything it talks to, which also ends
    # the CORS preflight on every request.
    #
    # This is not authentication. Every visitor still shares one organization's
    # data; it only stops the credential itself leaving the server.
    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_set_header X-Api-Key $incidentiq_api_key;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # An upload of several hundred log lines is a large POST by nginx's
        # default reckoning, and ingestion caps a batch at 500 events anyway.
        client_max_body_size 12m;

        # The AI analysis is requested here and awaited by a poll, but a slow
        # query should not be cut off mid-flight.
        proxy_read_timeout 120s;
    }

    # The realtime hub. The API accepts the key in the query string precisely
    # because a browser cannot set a header on a WebSocket handshake - but
    # nginx can, and the header is checked first, so the client no longer needs
    # the key for this either.
    location /hubs/ {
        proxy_pass http://api:8080/hubs/;
        proxy_set_header X-Api-Key $incidentiq_api_key;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;

        # A hub connection is idle whenever nothing is breaking, which is most
        # of the time. Without this nginx closes it after 60 seconds and the
        # dashboard silently falls back to polling.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Ingestion is a separate service, so it gets a separate prefix rather than
    # being folded in behind /api/ - the two have different contracts, different
    # rate limits and different reasons to be down.
    location /ingest/ {
        proxy_pass http://ingestion:8080/;
        proxy_set_header X-Api-Key $incidentiq_api_key;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 12m;
    }

    # Single-page app fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
