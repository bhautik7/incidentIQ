global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    platform: incidentiq
    environment: local

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Application services. Targets use Docker service names on the shared
  # network and container ports - not the host-published ports.
  - job_name: incidentiq-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8080"]
        labels: { service: incidentiq-api }

  - job_name: incidentiq-ingestion
    metrics_path: /metrics
    static_configs:
      - targets: ["ingestion:8080"]
        labels: { service: incidentiq-ingestion }

  - job_name: incidentiq-event-processor
    metrics_path: /metrics
    static_configs:
      - targets: ["event-processor:8080"]
        labels: { service: incidentiq-event-processor }

  - job_name: incidentiq-ai-analysis
    metrics_path: /metrics
    static_configs:
      - targets: ["ai-analysis:8000"]
        labels: { service: incidentiq-ai-analysis }
